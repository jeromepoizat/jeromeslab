name: Cross-platform CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: Windows ARM64
            os: windows-11-arm
          - name: Linux x64
            os: ubuntu-latest
          - name: Linux ARM64
            os: ubuntu-24.04-arm
          - name: macOS ARM64
            os: macos-latest
          - name: macOS Intel
            os: macos-15-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Bootstrap on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\install.ps1

      - name: Bootstrap on Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        run: ./install.sh

      - name: Verify repeatable bootstrap on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\install.ps1

      - name: Verify repeatable bootstrap on Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        run: ./install.sh

      - name: Run Python checks on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\.venv\Scripts\ruff.exe check .
          .\.venv\Scripts\mypy.exe src tests
          .\.venv\Scripts\pytest.exe

      - name: Run Python checks on Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./.venv/bin/ruff check .
          ./.venv/bin/mypy src tests
          ./.venv/bin/pytest

      - name: Run frontend lint on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: frontend
        run: ..\.runtime\node\node.exe ..\.runtime\pnpm\node_modules\pnpm\bin\pnpm.cjs lint

      - name: Run frontend lint on Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        working-directory: frontend
        run: ../.runtime/node/bin/node ../.runtime/pnpm/lib/node_modules/pnpm/bin/pnpm.cjs lint
