[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jeromes-laboratory"
version = "0.0.0"
description = "A local, provenance-first scientific research application"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Jerome's Laboratory contributors" }]
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.28",
    "keyring>=25.5",
    "platformdirs>=4.3",
    "pydantic>=2.10",
    "sqlalchemy>=2.0",
    "uvicorn>=0.34",
]

[project.urls]
Repository = "https://github.com/jeromepoizat/jeromeslab"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jeromes_laboratory"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
